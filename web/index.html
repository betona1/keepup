<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="습관을 사진으로 인증하면 도장이 찍히는 습관 챌린지 — 로그챌린지 웹판. 설치 없이 브라우저에서 바로.">
  <meta name="theme-color" content="#274ED5">

  <!-- 홈 화면에 추가(아이폰 포함) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="로그챌린지">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>로그챌린지 — 습관 인증 챌린지</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F7F9FF;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #10131A; }
    }
    /* 앱이 뜨기 전 잠깐 보이는 로딩 화면 */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", sans-serif;
      color: #274ED5;
    }
    #boot .mark {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 3px solid #B32A19;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 26px;
      color: #B32A19;
      transform: rotate(-6deg);
    }
    #boot .label { font-size: 13px; opacity: 0.75; }
    @media (prefers-color-scheme: dark) {
      #boot { color: #A9C0FF; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">인증</div>
    <div class="label">로그챌린지 불러오는 중…</div>
  </div>

  <script>
    // 플러터가 첫 프레임을 그리면 로딩 화면을 걷어낸다
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
