<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="습관을 사진으로 인증하면 도장이 찍히는 습관 챌린지 — 로그챌린지 웹판. 설치 없이 브라우저에서 바로.">
  <meta name="theme-color" content="#274ED5">

  <!-- 홈 화면에 추가(아이폰 포함) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="로그챌린지">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>로그챌린지 — 습관 인증 챌린지</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F7F9FF;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #10131A; }
    }
    /* 앱이 뜨기 전 잠깐 보이는 로딩 화면 */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", sans-serif;
      color: #274ED5;
    }
    /* 앱 도장과 같은 모습 — 바이올렛 링 안에 바브바브 얼굴, 살짝 기운 채로 */
    #boot .mark {
      width: 78px;
      height: 78px;
      box-sizing: border-box;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #7C5CFF, #A88BFF);
      box-shadow: 0 6px 20px rgba(124, 92, 255, 0.35);
      transform: rotate(-8deg);
    }
    #boot .mark .face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #EDE7FF;
    }
    #boot .mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 얼굴이 링을 꽉 채우도록 살짝 당긴다 (앱의 VaveFace zoom과 동일한 느낌) */
      transform: scale(1.3);
      transform-origin: 50% 42%;
    }
    #boot .label { font-size: 13px; opacity: 0.75; }
    @media (prefers-color-scheme: dark) {
      #boot { color: #A9C0FF; }
      #boot .mark .face { background: #251F45; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">
      <div class="face">
        <img src="assets/assets/character/vave_face.png" alt="바브바브 도장"
             onerror="this.style.display='none'">
      </div>
    </div>
    <div class="label">로그챌린지 불러오는 중…</div>
  </div>

  <script>
    // 플러터가 첫 프레임을 그리면 로딩 화면을 걷어낸다
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
