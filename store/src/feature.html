<!doctype html><html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1024px; height: 500px; overflow: hidden; }
body {
  font-family: 'Malgun Gothic', sans-serif; color: #fff; position: relative;
  background:
    radial-gradient(500px 400px at 8% -10%, rgba(43,109,246,0.32), transparent 60%),
    radial-gradient(600px 500px at 105% 120%, rgba(124,92,255,0.35), transparent 60%),
    linear-gradient(160deg, #131A2B 0%, #0B1020 55%, #140F2E 100%);
}
.stars i { position: absolute; border-radius: 50%; background: #fff; opacity: .85;
  box-shadow: 0 0 6px 2px rgba(124,247,255,.5); }
.left { position: absolute; left: 48px; top: 0; height: 100%; width: 400px;
  display: flex; flex-direction: column; justify-content: center; z-index: 3; }
.logo { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.logo .mark { width: 58px; height: 58px; border-radius: 50%; overflow: hidden;
  border: 3px solid #7C5CFF; background: #1A2436; transform: rotate(-8deg); }
.logo .mark img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.25); }
.logo .word { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
.logo .word .a { color: #A88BFF; } .logo .word .b { color: #6FB6FF; }
h1 { font-size: 40px; font-weight: 800; line-height: 1.3; letter-spacing: -1px; }
h1 .gold { color: #FFC24D; }
.sub { margin-top: 16px; font-size: 21px; color: #A9B7D0; font-weight: 600; }
.lineup { position: absolute; right: 22px; bottom: 0; top: 0; width: 560px;
  display: flex; align-items: center; justify-content: flex-end; gap: 10px; z-index: 2; }
.face { border-radius: 50%; overflow: hidden; background: #1A2436; border: 4px solid; flex: none; }
.face img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.15); }
</style></head><body>
<div class="stars">
  <i style="left:46%;top:10%;width:3px;height:3px"></i><i style="left:60%;top:78%;width:2px;height:2px"></i>
  <i style="left:52%;top:44%;width:2px;height:2px"></i><i style="left:96%;top:12%;width:3px;height:3px"></i>
  <i style="left:75%;top:6%;width:2px;height:2px"></i><i style="left:88%;top:88%;width:3px;height:3px"></i>
</div>
<div class="left">
  <div class="logo">
    <div class="mark"><img src="file:///E:/app/keepup/assets/character/vave_face.png"></div>
    <div class="word"><span class="a">로그</span><span class="b">챌린지</span></div>
  </div>
  <h1>습관이 도장으로,<br>도장은 <span class="gold">5단계 진화</span>로</h1>
  <div class="sub">매일 인증할수록 바브바브가 성장합니다</div>
</div>
<div class="lineup">
  <div class="face" style="width:80px;height:80px;border-color:#7C5CFF">
    <img src="file:///E:/app/keepup/assets/character/vave_face.png"></div>
  <div class="face" style="width:94px;height:94px;border-color:#37B4FF">
    <img src="file:///E:/app/keepup/assets/character/vave_face2.png"></div>
  <div class="face" style="width:112px;height:112px;border-color:#FF8A3D">
    <img src="file:///E:/app/keepup/assets/character/vave_face3.png"></div>
  <div class="face" style="width:138px;height:138px;border-color:#FFC24D;box-shadow:0 0 40px rgba(255,194,77,.55)">
    <img src="file:///E:/app/keepup/assets/character/vave_face4.png"></div>
  <div class="face" style="width:174px;height:174px;border-color:#7CF7FF;box-shadow:0 0 50px rgba(124,92,255,.65),0 0 30px rgba(124,247,255,.5)">
    <img src="file:///E:/app/keepup/assets/character/vave_face5.png"></div>
</div>
</body></html>
